<svg xmlns="http://www.w3.org/2000/svg" width="390" height="220" viewBox="0 0 390 220" role="img" aria-labelledby="title">
  <title id="title">878 total contributions, longest streak 13 days</title>
  <style>
    .sans{font-family:'Segoe UI',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif}
    .lbl{font-size:13px;font-weight:600;letter-spacing:3px;fill:#7d768a}
    .sheen{animation:sheen 10s ease-in-out 2.25s infinite}
    @keyframes sheen{0%{transform:translateX(-400px)}14%,100%{transform:translateX(1200px)}}
    @media (prefers-reduced-motion:reduce){*{animation:none!important}}
  </style>
  <defs>
    <radialGradient id="glow" cx="1" cy="0" r="1"><stop offset="0" stop-color="#904e95" stop-opacity=".2"/><stop offset=".7" stop-color="#904e95" stop-opacity="0"/></radialGradient>
    <linearGradient id="num" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ff9a76"/><stop offset=".55" stop-color="#e96443"/><stop offset="1" stop-color="#a24f8c"/></linearGradient>
    <linearGradient id="sheenG" x1="0" x2="1"><stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset=".5" stop-color="#fff" stop-opacity=".06"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>
    <clipPath id="frame"><rect width="390" height="220" rx="22"/></clipPath>
  </defs>
  <g clip-path="url(#frame)">
    <rect width="390" height="220" fill="#111015"/>
    <rect width="390" height="220" fill="url(#glow)"/>
    <g transform="rotate(20 195 110)"><rect class="sheen" x="0" y="-250" width="170" height="720" fill="url(#sheenG)"/></g>
  </g>
  <g class="sans">
    <text class="lbl" x="32" y="50">TOTAL CONTRIBUTIONS</text>
    <text x="30" y="116" font-size="64" font-weight="700" letter-spacing="-2" fill="url(#num)">878</text>
    <text class="lbl" x="32" y="156">LONGEST STREAK</text>
    <text x="32" y="194" font-size="30" font-weight="700" fill="#f5f2f8">13 days</text>
  </g>
  <rect x=".5" y=".5" width="389" height="219" rx="21.5" fill="none" stroke="#fff" stroke-opacity=".08"/>
</svg>
